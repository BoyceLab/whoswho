name: Build spine

on:
  workflow_dispatch:        # Actions tab > Build spine > Run workflow
  schedule:
    - cron: "0 6 1 */3 *"   # first of the month, every third month
  push:
    paths:
      - "curated/**"
      - "config/**"
      - "gene_spine/**"
      - "sources/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch automatic sources
        run: python -m gene_spine.fetch
      - name: Build
        run: python -m gene_spine.build
      # After the spine, never instead of it: the lists read what the build wrote. Without this
      # step the published CSVs would keep their old contents while the spine moved under them.
      - name: Derived lists
        run: python -m gene_spine.epilepsy_list
      - name: Tests
        run: python -m pytest -q tests
      - name: Commit outputs
        run: |
          git config user.name "spine-bot"
          git config user.email "spine-bot@users.noreply.github.com"
          git add -f outputs sources/manifest.json
          git diff --cached --quiet || git commit -m "Release $(date -u +%Y-%m-%d)"
          git push
